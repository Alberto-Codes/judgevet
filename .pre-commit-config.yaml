---
# Commit stage: the fast gates. Push stage: whole-repo docs and coverage.
#
# Every Python tool runs from the project environment through `uv run`. The
# lockfile then pins one version for the hook line and for CI. A pre-commit
# mirror carries its own pin, that pin drifts from the lockfile, and the two
# gates disagree. automarket lost time to exactly that drift, twice.
#
# Work lands directly on `main` here — no pull requests — so these hooks are
# the only gate between a change and the branch. Nothing runs after them.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Run before uv run can synchronize or refresh stale project metadata.
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        stages: [pre-commit, pre-push]

  # actionlint is a Go binary; uv.lock cannot pin its upstream toolchain.
  # CI runs this same hook so both paths use the upstream version below.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: yamllint
        name: YAML syntax and style
        entry: uv run yamllint --strict
        language: system
        types: [yaml]
        stages: [pre-commit, pre-push]

      - id: registry-manifest
        name: registry schema and release versions
        entry: uv run python -m scripts.registry_manifest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: release-config
        name: actual release-please updater checks
        entry: bash scripts/check_release_config.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-suppressions
        name: no gate suppressions
        entry: uv run python scripts/check_suppressions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-dependencies
        name: runtime dependencies pinned
        entry: uv run python scripts/check_dependencies.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-test-hygiene
        name: test hygiene
        entry: uv run python scripts/check_test_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: loc-check
        name: file size limit (300/320 code lines)
        entry: uv run python scripts/check_loc.py src
        language: system
        pass_filenames: false
        always_run: true

      - id: docvet
        name: docvet check
        entry: uv run docvet check
        language: system
        pass_filenames: false
        always_run: true

      # Native uv audit is experimental; verify flags when upgrading uv.
      - id: dependency-audit
        name: current lockfile dependency audit
        entry: uv audit --locked --preview-features audit-command
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The whole-repo check guards the branch at push time. The pre-commit
      # stage keeps its fast diff mode: a whole-repo check there would fail
      # commits for debt they did not introduce.
      - id: docvet-all
        name: docvet check --all
        entry: uv run docvet check --all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doc-python-examples
        name: isolated Python and CLI documentation examples
        entry: uv run python -m scripts.check_doc_python
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doc-example-schemas
        name: isolated documentation JSON and MCP schemas
        entry: uv run python -m scripts.check_doc_schemas
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doc-example-inventory
        name: documentation example inventory
        entry: uv run python -m scripts.doc_example_inventory
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: plain-english
        name: plain technical English
        entry: uv run python -m scripts.check_plain_english
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: terminology
        name: canonical terminology
        entry: uv run python -m scripts.check_terminology
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: docs-build
        name: strict documentation build and links
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: pytest
        name: pytest (unit + contract)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true

      # Coverage is the slowest gate and the one a single commit rarely moves.
      # It guards the branch at push time instead of every commit.
      - id: pytest-cov
        name: pytest with coverage floor
        entry: uv run pytest -q --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Verify commit messages follow Conventional Commits 1.0.0.
      - id: commit-msg-check
        name: commit-msg check
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
