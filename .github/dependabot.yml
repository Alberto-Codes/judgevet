---
# Ecosystem values `uv` and `github-actions`, `directory`, `directories` and
# `schedule.interval`:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# "For GitHub Actions, use the value /. Dependabot will search the
# /.github/workflows directory, as well as the action.yml/action.yaml file
# from the root directory."
# "The directories key supports globbing and the wildcard character *."
# `/.github/actions/*` adds each composite action, such as supply-chain.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
