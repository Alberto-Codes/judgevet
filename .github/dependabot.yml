---
# Ecosystem values `uv` and `github-actions`, `directory`, `directories` and
# `schedule.interval`:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# "For GitHub Actions, use the value /. Dependabot will search the
# /.github/workflows directory, as well as the action.yml/action.yaml file
# from the root directory."
# "The directories key supports globbing and the wildcard character *."
# `/.github/actions/*` adds each composite action, such as supply-chain.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # One group bumps `init` and `analyze` together. A bump of one alone
    # fails the analyze job: "All steps in a workflow that use
    # `github/codeql-action` must use the same version to work correctly."
    # https://github.com/Alberto-Codes/judgevet/actions/runs/38730866689/job/116408014443
    # Dependabot turns each `*` into `.*`, so the pattern matches `/init` and `/analyze`:
    # https://github.com/dependabot/dependabot-core/blob/main/common/lib/wildcard_matcher.rb
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
