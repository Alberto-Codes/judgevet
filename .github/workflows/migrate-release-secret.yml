name: Migrate release credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install isolated encryption dependency
        run: uv venv /tmp/seal-env && uv pip install --python /tmp/seal-env/bin/python PyNaCl==1.6.0
      - name: Seal existing credential for destination only
        env:
          SOURCE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          DESTINATION_KEY: 'qKyHQxi0xd4qcU6zyCLwWNF8bb0S6NkntoqIBR1jKSc='
          DESTINATION_KEY_ID: '3380204578043523366'
        run: |
          /tmp/seal-env/bin/python - <<'PYTHON'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          if not os.environ.get("SOURCE_PAT"):
              raise SystemExit("Source credential missing")
          encrypted = SealedBox(PublicKey(base64.b64decode(os.environ["DESTINATION_KEY"]))).encrypt(os.environ["SOURCE_PAT"].encode())
          Path("sealed.json").write_text(json.dumps({"key_id": os.environ["DESTINATION_KEY_ID"], "encrypted_value": base64.b64encode(encrypted).decode()}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-release-credential
          path: sealed.json
          retention-days: 1
          if-no-files-found: error
