---
name: Release Please

"on":
  push:
    branches: [main]

# Least-privilege: read-only by default. Each job escalates for itself.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: >-
        ${{ steps.release.outputs.prs_created == 'true' &&
        fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - name: Verify release credential
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ "$HAS_PAT" != true ]; then
            echo "::error::Release environment PAT is missing"
            exit 1
          fi
          identity="$(gh api user --jq .login)"
          if [ "$identity" != Alberto-Codes ]; then
            echo "::error::Unexpected release credential identity"
            exit 1
          fi
          echo "HAS_PAT=true"
          echo "PAT_IDENTITY=$identity"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'

      - name: Install pinned release engine
        run: >-
          npm --prefix scripts/release_config ci
          --ignore-scripts --no-audit --no-fund

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const {run} = require('./scripts/release_config/runner.cjs');
            try {
              await run({token: process.env.GH_TOKEN,
                repository: process.env.GITHUB_REPOSITORY,
                setOutput: (name, value) => core.setOutput(name, value)});
            } catch {
              core.setFailed('Release-please failed; inspect diagnostics');
            }


  update-lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release-please PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Pin the interpreter rather than trust the runner image, matching
      # ci.yml.
      - run: uv python install 3.12

      - name: Update uv.lock
        run: uv lock

      - name: Commit and push if changed
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(config): update uv.lock after version bump"
            git push
          fi
