name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked --dev

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          merge-multiple: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Verify exactly one wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          count=${#wheels[@]}
          if (( count != 1 )); then
            echo "::error::expected exactly one wheel in dist/, found ${count}"
            ls -la dist/
            exit 1
          fi
          printf 'WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"

      - name: Smoke test the wheel
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          "$(uv python find 3.12)" scripts/smoke_release.py --wheel "$WHEEL"

      - name: Smoke test installed MCP tools
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          "$(uv python find 3.12)" -m scripts.smoke_mcp_release --wheel "$WHEEL"

      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
