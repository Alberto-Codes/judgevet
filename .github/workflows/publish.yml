---
name: Publish to PyPI

"on":
  release:
    types: [published]

# Read-only by default. Each job below that needs more asks for it (#231).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked --dev

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Supply-chain files from the released commit and the same wheel and sdist
  # that go to PyPI, with signed attestations over the wheel and sdist.
  # https://docs.github.com/en/actions/concepts/security/artifact-attestations
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist
          merge-multiple: false

      - uses: ./.github/actions/supply-chain
        with:
          out: supply-chain
          dist: dist

      # actions/attest makes both attestations. With no predicate input it
      # makes build provenance; sbom-path makes an SBOM attestation. Its
      # bundle-path output is the Sigstore bundle on the runner's disk.
      # Several subjects share one attestation. The job needs no
      # artifact-metadata permission: the action writes a storage record
      # only when push-to-registry is true.
      # Latest release tag checked 2026-09-29:
      # https://github.com/actions/attest/releases
      # https://github.com/actions/attest#readme
      # https://github.com/actions/attest/blob/v4.2.2/action.yml
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # The runtime SBOM lists what installing the wheel pulls in. The mcp
      # and dev SBOMs stay release files without an attestation.
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: supply-chain/sbom-runtime.cdx.json

      # Scorecard's Signed-Releases check counts release files that end in
      # .sigstore.json. The bundles travel apart from the supply-chain files.
      # https://github.com/ossf/scorecard/blob/main/docs/checks.md#signed-releases
      # https://github.com/ossf/scorecard/blob/main/probes/releasesAreSigned/impl.go
      - name: Name the attestation bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::expected one wheel and one sdist in dist/"
            ls -la dist/
            exit 1
          fi
          release=$(basename "${sdists[0]}" .tar.gz)
          wheel=$(basename "${wheels[0]}")
          mkdir -p bundles
          cp "$PROVENANCE" "bundles/${release}.provenance.sigstore.json"
          cp "$SBOM" "bundles/${wheel}.sbom.sigstore.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: attestation-bundles
          path: bundles/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: supply-chain
          path: supply-chain/
          if-no-files-found: error

  # The only job that writes to the repository: it attaches the wheel, the
  # sdist, the attestation bundles and the supply-chain files to the release
  # that triggered this run. The wheel and sdist are the files PyPI gets.
  release-files:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: attestation-bundles
          path: bundles

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: supply-chain
          path: supply-chain

      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" dist/* bundles/* supply-chain/* --clobber
          --repo "$GITHUB_REPOSITORY"

  # Publishes only attested files. Nothing depends on this job.
  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist
          merge-multiple: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Verify exactly one wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          count=${#wheels[@]}
          if (( count != 1 )); then
            echo "::error::expected exactly one wheel in dist/, found ${count}"
            ls -la dist/
            exit 1
          fi
          printf 'WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"

      - name: Smoke test the wheel
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          "$(uv python find 3.12)" scripts/smoke_release.py --wheel "$WHEEL"

      - name: Smoke test installed MCP tools
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          "$(uv python find 3.12)" -m scripts.smoke_mcp_release --wheel "$WHEEL"

      - run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
