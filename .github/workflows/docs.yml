---
name: Documentation

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - uses: actions/configure-pages@v6.0.0
      - run: uv run mkdocs build --strict
      # Coverage badge endpoint (#50): https://shields.io/badges/endpoint-badge
      - run: uv sync --locked --dev --extra mcp
      - run: uv run pytest -q -n auto --cov -m "not live"
      - run: uv run coverage json -o coverage.json
      - run: >-
          uv run python scripts/coverage_badge.py
          coverage.json site/badges/coverage.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5.0.1
