name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked --dev

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          merge-multiple: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      # --index and --check-url are mutually exclusive: uv rejects the pair
      # with "the argument '--index <INDEX>' cannot be used with
      # '--check-url <CHECK_URL>'". --index names the entry in
      # [[tool.uv.index]], which already carries both `url` (what --check-url
      # would set) and `publish-url`, so passing it again is redundant as well
      # as fatal. publish.yml does not hit this because it passes no --index.
      #
      # --trusted-publishing is orthogonal to --index and is what makes the
      # OIDC exchange happen, matching publish.yml.
      - run: uv publish --index testpypi --trusted-publishing always
