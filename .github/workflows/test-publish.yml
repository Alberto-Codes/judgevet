name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked --dev

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          merge-multiple: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install 3.12

      # This job never checks out the repository — it only downloads the
      # artifact the build job produced. So there is no pyproject.toml here
      # and `--index testpypi` cannot resolve:
      #
      #   error: No indexes were found, can't use index: `testpypi`
      #
      # publish.yml has the same shape and works because it passes explicit
      # URLs rather than an index name. The [[tool.uv.index]] entry in
      # pyproject.toml stays useful for publishing by hand from a checkout;
      # it is simply not reachable from here.
      #
      # --publish-url and --check-url are independent flags and may be used
      # together. It is --index that is mutually exclusive with --check-url.
      - run: |
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/
