name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m scripts.doc_example_inventory
      - run: uv run python -m scripts.check_plain_english
      - run: uv run python -m scripts.check_terminology
      - run: uv run python -m scripts.check_doc_python
      - run: uv run mkdocs build --strict
      - run: uv run lint-imports
      - run: uv run python scripts/check_suppressions.py
      - run: uv run python scripts/check_commit_msg.py --range ${{ github.event.before }}..${{ github.sha }}
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      - run: uv run python scripts/check_commit_msg.py --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra mcp
      - run: uv run ty check
      - run: uv run python -m scripts.check_doc_schemas
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra mcp
      - run: uv run pytest -q --cov -m "not live"
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@v1
        id: docvet
        with:
          checks: "enrichment,freshness,coverage,griffe,presence"
