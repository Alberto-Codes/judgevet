---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.20"
      # Native uv audit is experimental; verify flags when upgrading uv.
      - run: uv audit --locked --preview-features audit-command

  # Supply-chain evidence for procurement (#59): CycloneDX source SBOMs per
  # scope, a licence table read from installed metadata, and the audit as
  # JSON. publish.yml runs the same action for each release (#231).
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/supply-chain
        with:
          out: supply-chain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: supply-chain
          path: supply-chain/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-py3.12-${{
            hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run yamllint --all-files
      - run: uv run pre-commit run actionlint --all-files
      - run: uv run python -m scripts.registry_manifest
      - run: bash scripts/check_release_config.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m scripts.doc_example_inventory
      - run: uv run python -m scripts.check_plain_english
      - run: uv run python -m scripts.check_terminology
      - run: uv run python -m scripts.check_doc_python
      - run: uv run mkdocs build --strict
      - run: uv run lint-imports
      - run: uv run python scripts/check_loc.py src
      - run: uv run python scripts/check_suppressions.py
      - run: >-
          uv run python scripts/check_commit_msg.py
          --range ${{ github.event.before }}..${{ github.sha }}
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
      - run: >-
          uv run python scripts/check_commit_msg.py --range
          ${{ github.event.pull_request.base.sha }}..${{
          github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra mcp
      - run: uv run ty check
      - run: uv run python -m scripts.check_doc_schemas
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra mcp
      # One xdist worker per runner vCPU; pytest-cov combines their data.
      - run: >-
          uv run pytest -q -n auto --cov --cov-report=term
          --cov-report=xml -m "not live"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  provider-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: >-
          uv run pre-commit run provider-artifacts
          --hook-stage pre-push --all-files
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@7a0463ddf05248215df59386045cb8532183aef3  # v1
        id: docvet
        with:
          checks: "enrichment,freshness,coverage,griffe,presence"
