---
# Supply-chain files for CI (#59) and each release (#231). The caller checks
# out the commit first; this action generates everything from that tree.
name: Supply-chain files
description: >-
  Export source SBOMs from uv.lock, label them pre-build, write licence
  tables, audit the lockfile as JSON and record provenance.

inputs:
  out:
    description: Directory that receives the files.
    default: supply-chain
  dist:
    description: >-
      Directory holding exactly one wheel and one sdist whose SHA-256 goes
      into provenance.txt. Empty skips the release file hashes.
    default: ""

runs:
  using: composite
  steps:
    # SBOM export and JSON audit output are uv previews; verify on upgrade.
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.11.20"
    - run: uv python install 3.12
      shell: bash
    - run: uv sync --locked --dev --extra mcp
      shell: bash
    - run: mkdir -p "$OUT"
      shell: bash
      env:
        OUT: ${{ inputs.out }}
    # --format cyclonedx1.5 needs --preview-features sbom-export:
    # https://docs.astral.sh/uv/reference/cli/#uv-export
    - name: Export CycloneDX 1.5 SBOMs
      id: export
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        export_sbom() {
          uv export --format cyclonedx1.5 --preview-features sbom-export \
            --locked "$@"
        }
        export_sbom --no-dev -o "$OUT/sbom-runtime.cdx.json"
        export_sbom --no-dev --extra mcp -o "$OUT/sbom-runtime-mcp.cdx.json"
        export_sbom --only-dev -o "$OUT/sbom-dev.cdx.json"
    # The export reads uv.lock, not a built wheel: a source SBOM. CycloneDX
    # 1.5 names that phase pre-build; uv 0.11.20 sets no lifecycle.
    # https://cyclonedx.org/docs/1.5/json/#metadata_lifecycles
    - name: Label SBOMs with the pre-build lifecycle
      id: lifecycle
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        uv run --no-sync python scripts/sbom_lifecycle.py \
          "$OUT/sbom-runtime.cdx.json" \
          "$OUT/sbom-runtime-mcp.cdx.json" \
          "$OUT/sbom-dev.cdx.json"
    # --no-sync: a plain uv run would re-sync without the mcp extra and
    # drop the mcp packages before the licence lookup.
    - name: Write licence tables
      id: licence
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        for scope in runtime runtime-mcp dev; do
          uv run --no-sync python scripts/licence_report.py \
            "$OUT/sbom-$scope.cdx.json" \
            --markdown "$OUT/licences-$scope.md" \
            --json "$OUT/licences-$scope.json"
        done
    # --output-format json and the json-output preview feature:
    # https://docs.astral.sh/uv/reference/cli/#uv-audit
    # https://docs.astral.sh/uv/concepts/preview/
    - name: Audit the lockfile as JSON
      id: audit
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: >-
        uv audit --locked --preview-features audit-command,json-output
        --output-format json > "$OUT/audit.json"
    # A failed or skipped step marks the files incomplete.
    - name: Record provenance
      if: always()
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        DIST: ${{ inputs.dist }}
        EXPORT: ${{ steps.export.outcome }}
        LIFECYCLE: ${{ steps.lifecycle.outcome }}
        LICENCE: ${{ steps.licence.outcome }}
        AUDIT: ${{ steps.audit.outcome }}
      run: |
        shopt -s nullglob
        complete=yes
        for outcome in "$EXPORT" "$LIFECYCLE" "$LICENCE" "$AUDIT"; do
          [[ "$outcome" == success ]] || complete=no
        done
        hashes=()
        if [[ -n "$DIST" ]]; then
          wheels=("$DIST"/*.whl)
          sdists=("$DIST"/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::expected one wheel and one sdist in $DIST"
            complete=no
          fi
          for file in "${wheels[@]}"; do
            hashes+=("wheel_sha256: $(sha256sum "$file")")
          done
          for file in "${sdists[@]}"; do
            hashes+=("sdist_sha256: $(sha256sum "$file")")
          done
        fi
        {
          echo "generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "commit: $(git rev-parse HEAD)"
          echo "uv: $(uv --version)"
          echo "uv_lock_sha256: $(sha256sum uv.lock | cut -d' ' -f1)"
          echo "sbom_scope: source SBOM of the dependency graph uv.lock" \
            "declares (CycloneDX lifecycle pre-build), not a build SBOM" \
            "of the wheel"
          echo "sbom_export: $EXPORT"
          echo "sbom_lifecycle: $LIFECYCLE"
          echo "licence_report: $LICENCE"
          echo "audit_json: $AUDIT"
          if (( ${#hashes[@]} )); then printf '%s\n' "${hashes[@]}"; fi
          echo "complete: $complete"
        } > "$OUT/provenance.txt"
        [[ "$complete" == yes ]]
